name: Build Nuvio Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate metadata, build artifacts, create or publish a release, or attach the universal APK
        required: true
        type: choice
        options:
          - dry-run
          - build
          - draft
          - publish
          - attach-universal
        default: dry-run
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nuvio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build sideload iOS IPA
    if: inputs.mode == 'build' || inputs.mode == 'draft' || inputs.mode == 'publish'
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      NUVIO_IOS_DISTRIBUTION: full
      # The Xcode build script starts Gradle, the Kotlin daemon, and Kotlin/Native together.
      # Keep their heaps below the hosted runner memory limit to avoid a stalled build.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m"
        -Dorg.gradle.configuration-cache=false
        -Pkotlin.daemon.jvmargs=-Xmx4g
        -Pkotlin.native.jvmArgs=-Xmx4g
      KOTLIN_DAEMON_JVMARGS: -Xmx4g

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch MPVKit
        run: git submodule update --init MPVKit

      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download Nuvio Engine Apple XCFramework
        env:
          NUVIO_ENGINE_VERSION: 0.1.1
        run: |
          set -euo pipefail

          engine_root="../nuvio-engine/platform/apple"
          engine_destination="${engine_root}/NuvioEngine.xcframework"
          archive="${RUNNER_TEMP}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}.zip"
          extract_directory="${RUNNER_TEMP}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}"

          rm -rf "${engine_root}" "${extract_directory}" "${archive}"
          mkdir -p "${engine_root}" "${extract_directory}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            "https://github.com/NuvioMedia/nuvio-engine/releases/download/v${NUVIO_ENGINE_VERSION}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}.zip" \
            --output "${archive}"
          ditto -x -k "${archive}" "${extract_directory}"

          xcframework="$(find "${extract_directory}" -type d -name NuvioEngine.xcframework -print -quit)"
          if [[ -z "${xcframework}" ]]; then
            echo "NuvioEngine.xcframework was not found in the downloaded archive." >&2
            exit 1
          fi
          ditto "${xcframework}" "${engine_destination}"

          for slice in ios-arm64 ios-arm64_x86_64-simulator; do
            slice_directory="${engine_destination}/${slice}"
            test -f "${slice_directory}/libCNuvioEngine.a"
            test -f "${slice_directory}/Headers/nuvio_engine/nuvio_engine.h"
          done

      - name: Configure full iOS build
        run: |
          cat > local.properties <<EOF
          NUVIO_IOS_DISTRIBUTION=${NUVIO_IOS_DISTRIBUTION}
          EOF

      - name: Build unsigned full iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package sideload IPA
        id: package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          products_directory="iosApp/build/Build/Products/Release-iphoneos"
          app_directory="$(find "${products_directory}" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "${app_directory}" || ! -f "${app_directory}/Info.plist" ]]; then
            echo "The unsigned iOS app was not produced." >&2
            exit 1
          fi

          app_version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "${app_directory}/Info.plist")"
          if [[ "${app_version}" != "${RELEASE_VERSION}" ]]; then
            echo "IPA version ${app_version} does not match release version ${RELEASE_VERSION}." >&2
            exit 1
          fi

          staging_directory="${RUNNER_TEMP}/nuvio-ipa-staging"
          output_directory="${GITHUB_WORKSPACE}/iosApp/build/ipa"
          ipa_name="Nuvio-Enhanced-v${app_version}-Full-unsigned.ipa"
          rm -rf "${staging_directory}" "${output_directory}"
          mkdir -p "${staging_directory}/Payload" "${output_directory}"
          ditto "${app_directory}" "${staging_directory}/Payload/$(basename "${app_directory}")"
          (
            cd "${staging_directory}"
            /usr/bin/zip -qry "${output_directory}/${ipa_name}" Payload
          )

          test -f "${output_directory}/${ipa_name}"
          unzip -l "${output_directory}/${ipa_name}" | grep -q 'Payload/.*\.app/Info.plist'
          echo "ipa_name=${ipa_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload sideload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuvio-${{ steps.release.outputs.version }}-ios-full-unsigned
          path: iosApp/build/ipa/${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error

  release:
    name: ${{ inputs.mode }} Nuvio release
    needs: build-ios
    if: ${{ always() && (inputs.mode == 'dry-run' || inputs.mode == 'attach-universal' || needs.build-ios.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      EXPECTED_ANDROID_SIGNING_SHA256: 4d87e3d92c54ae0efcdebb75dd08b8cfca1eace052198ed3b8f3f552533a21e3

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" == "draft" || "${RELEASE_MODE}" == "publish" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Tag ${RELEASE_TAG} already exists." >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
              exit 1
            fi

            unexpected_changes="$(
              git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
                | grep -Ev '^(\.github/workflows/android-release\.yml|scripts/(generate-release-notes|release-metadata)\.sh)$' \
                || true
            )"
            if [[ -n "${unexpected_changes}" ]]; then
              echo "The version bump must be the final application change before release." >&2
              echo "Unexpected files changed after the bump:" >&2
              echo "${unexpected_changes}" >&2
              exit 1
            fi
          fi

          if [[ "${RELEASE_MODE}" != "dry-run" ]]; then
            required_secrets=(
              RELEASE_PROPERTIES_BASE64
              RELEASE_KEYSTORE_BASE64
            )
            missing=()
            for secret_name in "${required_secrets[@]}"; do
              if [[ -z "${!secret_name}" ]]; then
                missing+=("${secret_name}")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
              exit 1
            fi
          fi

      - name: Generate release notes
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
        run: |
          ./scripts/generate-release-notes.sh \
            --from "${PREVIOUS_BUMP}" \
            --to "${CURRENT_BUMP}" \
            --repository "${GITHUB_REPOSITORY}" \
            --exclude "${EXCLUDE_COMMITS}" \
            > release-commits.md

          if [[ ! -s release-commits.md ]]; then
            echo "No release-note commits were found." >&2
            exit 1
          fi

          awk -v version="${RELEASE_VERSION}" '
            index($0, "## " version) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-changelog.md

          if [[ ! -s release-changelog.md ]]; then
            echo "CHANGELOG.md has no section for ${RELEASE_VERSION}." >&2
            exit 1
          fi

          {
            echo "## Changelog"
            cat release-changelog.md
            echo
            echo "## Commits"
            cat release-commits.md
            echo
            echo "## iOS and iPadOS"
            echo
            echo "Published releases include the Full sideload variant as an unsigned IPA."
            echo "Install it with AltStore or SideStore, which signs it with your own Apple account."
          } > release-notes.md

          {
            echo "## ${RELEASE_VERSION} release notes"
            echo
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Java
        if: inputs.mode != 'dry-run'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: inputs.mode != 'dry-run'
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release properties
        if: inputs.mode != 'dry-run'
        run: |
          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties

          # These paths only apply to the machine where local.properties was encoded.
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties

          for property_name in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID; do
            property_value="${!property_name-}"
            if [[ -n "${property_value}" ]]; then
              sed -i -E "/^[[:space:]]*${property_name}[[:space:]]*=/d" local.properties
              printf '%s=%s\n' "${property_name}" "${property_value}" >> local.properties
            fi
          done

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
            SIMKL_CLIENT_ID
          )
          for property_name in "${required_properties[@]}"; do
            property_value="${!property_name-}"
            if ! grep -Eq "^${property_name}=.+" local.properties && [[ -z "${property_value}" ]]; then
              echo "Missing required property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Build full release APKs
        if: inputs.mode != 'dry-run'
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Verify Android signing certificate
        if: inputs.mode != 'dry-run'
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${sdk_root}" ]]; then
            echo "The Android SDK path is not configured." >&2
            exit 1
          fi
          build_tools_dir="$(
            find "${sdk_root}/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print |
              sort -V |
              tail -n 1
          )"
          apksigner="${build_tools_dir}/apksigner"
          if [[ ! -x "${apksigner}" ]]; then
            echo "apksigner was not found in the Android SDK." >&2
            exit 1
          fi

          mapfile -t release_apks < <(
            find androidApp/build/outputs/apk/full/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print |
              sort
          )
          if (( ${#release_apks[@]} == 0 )); then
            echo "No release APKs were produced." >&2
            exit 1
          fi

          universal_apk="androidApp/build/outputs/apk/full/release/androidApp-full-universal-release.apk"
          if [[ ! -f "${universal_apk}" ]]; then
            echo "Universal release APK was not produced." >&2
            exit 1
          fi

          expected_digest="$(
            printf '%s' "${EXPECTED_ANDROID_SIGNING_SHA256}" |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':[:space:]'
          )"
          for apk in "${release_apks[@]}"; do
            actual_digest="$(
              "${apksigner}" verify --print-certs "${apk}" |
                sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' |
                head -n 1 |
                tr '[:upper:]' '[:lower:]' |
                tr -d ':[:space:]'
            )"
            if [[ -z "${actual_digest}" ]]; then
              echo "Could not read the signing certificate from ${apk}." >&2
              exit 1
            fi
            if [[ "${actual_digest}" != "${expected_digest}" ]]; then
              echo "Signing certificate mismatch for ${apk}." >&2
              echo "Expected: ${expected_digest}" >&2
              echo "Actual:   ${actual_digest}" >&2
              echo "This APK cannot update an existing Nuvio Enhanced installation." >&2
              exit 1
            fi
          done

      - name: Upload build artifacts
        if: inputs.mode != 'dry-run'
        uses: actions/upload-artifact@v6
        with:
          name: nuvio-${{ steps.release.outputs.version }}-full-release
          path: androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Download sideload IPA artifact
        if: inputs.mode == 'draft' || inputs.mode == 'publish'
        uses: actions/download-artifact@v7
        with:
          name: nuvio-${{ steps.release.outputs.version }}-ios-full-unsigned
          path: ios-release

      - name: Create GitHub release
        if: inputs.mode == 'draft' || inputs.mode == 'publish'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          mapfile -t release_apks < <(find androidApp/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#release_apks[@]} == 0 )); then
            echo "No release APKs were produced." >&2
            exit 1
          fi
          mapfile -t release_ipas < <(find ios-release -maxdepth 1 -type f -name '*.ipa' -print | sort)
          if (( ${#release_ipas[@]} != 1 )); then
            echo "Expected exactly one sideload IPA, found ${#release_ipas[@]}." >&2
            exit 1
          fi

          release_args=(
            "${RELEASE_TAG}"
            --target "${RELEASE_BRANCH}"
            --title "${RELEASE_VERSION}"
            --notes-file release-notes.md
          )
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          gh release create "${release_args[@]}" "${release_apks[@]}" "${release_ipas[@]}"

      - name: Attach universal APK to existing release
        if: inputs.mode == 'attach-universal'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload \
            "${RELEASE_TAG}" \
            androidApp/build/outputs/apk/full/release/androidApp-full-universal-release.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
